name: Bug report
description: Report a reproducible problem using synthetic data
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior. Do not share credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small public example, steps, and the relevant error or verification report.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: AppCapsule version, Node version, operating system, Vite version
    validations:
      required: true
